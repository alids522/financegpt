// Keep compiler artifacts on Maven repositories when the plugin portal redirects
// large jars to unavailable GitHub release URLs. This also covers included builds.
def useKotlinMirror = { repositories ->
    repositories.exclusiveContent {
        forRepository {
            maven { url = 'https://repo.huaweicloud.com/repository/maven' }
        }
        filter { includeGroupByRegex('org.jetbrains.kotlin.*') }
    }
}
settingsEvaluated { settings ->
    useKotlinMirror(settings.pluginManagement.repositories)
    useKotlinMirror(settings.dependencyResolutionManagement.repositories)
}
allprojects { project ->
    useKotlinMirror(project.buildscript.repositories)
}
