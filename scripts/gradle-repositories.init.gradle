// Prefer the Maven mirror for Kotlin jars redirected to unavailable release URLs.
// Use ordinary content filtering: exclusive plugin repositories prohibit Flutter's
// own buildscript repositories in included builds.
def useKotlinMirror = { repositories ->
    def mirror = repositories.maven {
        name = 'financeKotlinMirror'
        url = 'https://repo.huaweicloud.com/repository/maven'
        content { includeGroupByRegex('org.jetbrains.kotlin.*') }
    }
    repositories.remove(mirror)
    repositories.addFirst(mirror)
}
settingsEvaluated { settings ->
    useKotlinMirror(settings.pluginManagement.repositories)
    useKotlinMirror(settings.dependencyResolutionManagement.repositories)
    def permitsProjectRepositories = settings.dependencyResolutionManagement.repositoriesMode.get().toString() == 'PREFER_PROJECT'
    gradle.beforeProject { project ->
        useKotlinMirror(project.buildscript.repositories)
        if (permitsProjectRepositories) {
            useKotlinMirror(project.repositories)
        }
    }
}
