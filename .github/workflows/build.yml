name: Verify and build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded
      - name: Configure persistent Android release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=financegpt\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build web --release
      - name: Package files and checksums
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk finance-tracker-android.apk
          cd build/web && zip -qr ../../finance-tracker-web.zip .
          cd ../.. && sha256sum finance-tracker-android.apk finance-tracker-web.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-android
          path: |
            finance-tracker-android.apk
            SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-web
          path: finance-tracker-web.zip
          retention-days: 30
      - name: Publish downloadable build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-build.${{ github.run_number }}" finance-tracker-android.apk finance-tracker-web.zip SHA256SUMS.txt --title "Finance Tracker v1.0 · build ${{ github.run_number }}" --notes "Installable Android APK and Flutter Web bundle. Backend: financegpt schema. CI verification: formatting, static analysis, unit and widget tests."
